# Datos de mapas que van dentro del APK: todos los archivos del manifest salvo los bajo demanda.
# Los baja y verifica gradle/descargas.gradle.kts. Para actualizarlos: etiqueta de la release de
# trombonet12/rally-copilot-data y SHA-256 de su manifest.json (sha256sum manifest.json).
etiqueta=datos-2026.11.07-15
manifestSha256=7faea0ee1ed1b75c6a674c2081b09ce145792c71e2ae0a2b513c33799d30a9bd
# Prefijos de los ids del manifest que NO van en el APK (se descargan al elegirlos y luego funcionan sin red): satélite,
# relieve + curvas de nivel y voz Sharvard. Deben coincidir con Complemento.PREFIJOS_BAJO_DEMANDA del motor (lo
# comprueba DatosIncluidosPropertiesTest).
bajoDemanda=satelite,relieve,curvas,voz-sharvard
# sherpa-onnx (AAR oficial de la release de GitHub, fuera del Version Catalog): versión y SHA-256 verificados.
# Para actualizar: cambiar los dos juntos (gradle/descargas.gradle.kts los lee de aquí).
sherpaVersion=1.13.8
sherpaSha256=633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96
