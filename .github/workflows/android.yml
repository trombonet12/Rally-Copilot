name: Android

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'motor/**'
      - 'config/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'version.properties'
      - 'distribution/**'
      - '.editorconfig'
      - '.gitattributes'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/humo-release.mjs'
      - 'scripts/humo-release.test.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'motor/**'
      - 'config/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'version.properties'
      - 'distribution/**'
      - '.editorconfig'
      - '.gitattributes'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/humo-release.mjs'
      - 'scripts/humo-release.test.mjs'
      - '.github/workflows/android.yml'
  # Manual: por defecto solo compila. Con `publicar` activado en main publica la release (p. ej. un parche).
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar release firmada (solo en main; el parche se calcula del historial)'
        type: boolean
        default: false
      humo_emulador:
        description: 'Arrancar el release minificado en un emulador y buscar FATAL en logcat (unos 30 min)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # En main no se cancela un run en curso: podria llevar una release a medias.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Gate Android y motor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Historial completo: el build calcula versionName/versionCode contando commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Descargas verificadas por SHA-256 en Gradle (app/build.gradle.kts): la caché solo ahorra red.
      - name: Caché de descargas (.descargas)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .descargas
          key: descargas-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'gradle/descargas.gradle.kts', 'app/datos-incluidos.properties') }}
      - name: Propiedades locales (solo sdk.dir)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      # minifyReleaseWithR8 sin firma: los fallos de R8 (reglas -dontwarn) salen aquí y no solo al publicar.
      - name: ktlint, detekt, lint, tests, assembleDebug y R8
        run: ./gradlew ktlintCheck detekt lintDebug testDebugUnitTest :motor:test assembleDebug :app:minifyReleaseWithR8
      # Humo del release minificado (QA-3): las clases de las reglas keep (sherpa JNI, Vosk, JNA, serializadores) tienen que
      # sobrevivir en mapping.txt/usage.txt. Los tests corren sin minificar y no verían un keep que falte.
      - name: Humo de R8 (clases keep)
        run: |
          node --test scripts/humo-release.test.mjs
          node scripts/humo-release.mjs
      # Cobertura (QA-11). Mínimo de líneas solo en el motor; la app solo informa. Kover instrumenta los tests del gate, así
      # que aquí solo se generan los informes y se comprueba el mínimo.
      - name: Cobertura mínima del motor
        run: ./gradlew :motor:koverVerify
      - name: Informes de cobertura (no bloqueante)
        continue-on-error: true
        run: ./gradlew koverXmlReport koverHtmlReport
      - name: Subir informes de cobertura
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura
          path: |
            app/build/reports/kover/
            motor/build/reports/kover/
          if-no-files-found: ignore
          retention-days: 14
      # Resumen de tests en el run (QA-19). Un test saltado (assume, @Ignore) hace fallar el gate: no se quita cobertura en silencio.
      - name: Resumen de tests
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import glob, os, sys
          import xml.etree.ElementTree as ET

          modulos = {}
          saltados = []
          for ruta in sorted(glob.glob('*/build/test-results/**/TEST-*.xml', recursive=True)):
              modulo = ruta.split('/')[0]
              suite = ET.parse(ruta).getroot()
              m = modulos.setdefault(modulo, dict(tests=0, fallos=0, saltados=0, tiempo=0.0))
              m['tests'] += int(suite.get('tests', 0))
              m['fallos'] += int(suite.get('failures', 0)) + int(suite.get('errors', 0))
              m['saltados'] += int(suite.get('skipped', 0))
              m['tiempo'] += float(suite.get('time', 0))
              for caso in suite.iter('testcase'):
                  if caso.find('skipped') is not None:
                      saltados.append(f"{caso.get('classname')}.{caso.get('name')}")

          lineas = ['## Tests', '', '| Módulo | Tests | Fallos | Saltados | Tiempo (s) |', '|---|---|---|---|---|']
          for nombre, m in modulos.items():
              lineas.append(f"| {nombre} | {m['tests']} | {m['fallos']} | {m['saltados']} | {m['tiempo']:.0f} |")
          if not modulos:
              lineas.append('| (sin resultados) | 0 | 0 | 0 | 0 |')
          if saltados:
              lineas += ['', '### Saltados', ''] + [f'- `{n}`' for n in saltados]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(chr(10).join(lineas) + chr(10))

          if saltados:
              print(f'::error::{len(saltados)} test(s) saltados: el gate no admite tests saltados (ver el resumen del run).')
              sys.exit(1)
          PY
      # El APK debug solo hace falta de main o de un run manual (QA-18); en un PR solo alarga el job.
      - name: Subir APK debug
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Subir reportes de lint y tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Humo del release minificado (QA-3): solo a mano (workflow_dispatch con `humo_emulador`). Compila el release sin firmar
  # con x86_64 añadido (solo aquí, -Prally.humoEmulador), lo firma con un keystore efímero que se borra al acabar (no es
  # el de la release: no hay secretos en este job), lo instala en un emulador, arranca la app y falla si logcat trae FATAL.
  humo-emulador:
    name: Humo del release en emulador (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.humo_emulador
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Caché de descargas (.descargas)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .descargas
          key: descargas-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'gradle/descargas.gradle.kts', 'app/datos-incluidos.properties') }}
      - name: Propiedades locales (solo sdk.dir)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Release minificado sin firmar (con x86_64 para el emulador)
        run: ./gradlew -Prally.sinFirma=true -Prally.humoEmulador=true assembleRelease
      - name: Humo de R8 (clases keep)
        run: node scripts/humo-release.mjs
      - name: Firmar con un keystore efímero
        run: |
          set -euo pipefail
          ks="$RUNNER_TEMP/humo.jks"
          pass="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
          keytool -genkeypair -keystore "$ks" -storepass "$pass" -keypass "$pass" -alias humo \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=humo-emulador"
          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          sin="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          test -n "$sin" || { echo "::error::No se generó el APK release"; exit 1; }
          export KS_PASS="$pass"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias humo --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out "$RUNNER_TEMP/humo-release.apk" "$sin"
          rm -f "$ks"
      # KVM para el emulador (ver la documentación de reactivecircus/android-emulator-runner).
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Fijado por SHA de v2.38.0 (2026-07-05, más de dos semanas de antigüedad).
      - name: Arrancar la app en el emulador y buscar FATAL en logcat
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6144M
          disable-animations: true
          script: bash scripts/humo-emulador.sh "$RUNNER_TEMP/humo-release.apk" 45 humo-emulador
      - name: Subir logcat del humo
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: humo-emulador
          path: humo-emulador/
          if-no-files-found: ignore
          retention-days: 7
      - name: Borrar propiedades locales y keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/humo.jks" "$RUNNER_TEMP/humo-release.apk" local.properties

  release:
    name: Release firmada (si la version es nueva)
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publicar))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Los secretos de firma viven en el Environment `release` (restringido a la rama main), no en el repositorio.
    environment: release
    # Solo lectura: su GITHUB_TOKEN no puede escribir. Gradle compila SIN firmar y sin secretos en el entorno;
    # solo el paso «Firmar y verificar» (apksigner/jarsigner del SDK) ve el keystore.
    # La release de GitHub (escritura) la crea el job `github-release`, que no ve el keystore.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
      code: ${{ steps.ver.outputs.code }}
      publicar: ${{ steps.ver.outputs.publicar }}
    concurrency:
      group: release-android
      cancel-in-progress: false
    # Secrets requeridos (Settings > Environments > release > Environment secrets):
    # ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
    # Opcional: PLAY_SERVICE_ACCOUNT_JSON, que usa el job `play` (abajo).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Historial completo: el parche y el versionCode salen del recuento de commits.
          fetch-depth: 0

      # Un push solo publica si toca version.properties (subida de la menor). Los parches salen
      # a mano con workflow_dispatch + publicar. Si el rango del push no se puede resolver, no se publica.
      - name: Decidir si corresponde publicar
        id: gate
        env:
          EVENTO: ${{ github.event_name }}
          ANTES: ${{ github.event.before }}
        run: |
          set -euo pipefail
          candidato=false
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            candidato=true
          elif git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            if ! git diff --quiet "$ANTES" "$GITHUB_SHA" -- version.properties; then
              candidato=true
            fi
          fi
          [ "$candidato" = "true" ] || echo "version.properties no cambia en este push: sin release"
          echo "candidato=$candidato" >> "$GITHUB_OUTPUT"

      # El script que usa la clave de Play se guarda antes de Gradle: ninguna tarea del build puede reescribirlo.
      - name: Guardar el script de Play
        if: steps.gate.outputs.candidato == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-script
          path: scripts/play-promocionar.mjs
          if-no-files-found: error
          retention-days: 7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.gate.outputs.candidato == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.gate.outputs.candidato == 'true'

      # Descargas verificadas por SHA-256 en Gradle (app/build.gradle.kts): la caché solo ahorra red.
      - name: Caché de descargas (.descargas)
        if: steps.gate.outputs.candidato == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .descargas
          key: descargas-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts', 'gradle/descargas.gradle.kts', 'app/datos-incluidos.properties') }}

      - name: Propiedades locales (solo sdk.dir)
        if: steps.gate.outputs.candidato == 'true'
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Leer version y comprobar si ya esta publicada
        id: ver
        if: steps.gate.outputs.candidato == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          linea="$(./gradlew -q :app:imprimirVersion | tr -d '\r' | tail -n1)"
          version="${linea%% *}"
          code="${linea#* }"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::versionName invalido en la salida de :app:imprimirVersion: '$linea'"
            exit 1
          fi
          if ! printf '%s' "$code" | grep -Eq '^[0-9]+$'; then
            echo "::error::versionCode invalido en la salida de :app:imprimirVersion: '$linea'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if gh release view "v${version}" > /dev/null 2>&1; then
            echo "v${version} ya publicada, nada que hacer"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verificar secrets de firma
        if: steps.ver.outputs.publicar == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta el secret $name. Configuralo en Settings > Secrets and variables > Actions (un release sin firma no sirve)."
              missing=1
            fi
          done
          exit "$missing"

      # Sin secretos en el entorno: los plugins y dependencias de Gradle nunca ven el keystore (SEG-1).
      - name: assembleRelease y bundleRelease (sin firmar)
        if: steps.ver.outputs.publicar == 'true'
        run: ./gradlew -Prally.sinFirma=true assembleRelease bundleRelease

      # Unico paso con el keystore: lo decodifica, firma con las herramientas del SDK y del JDK (no con Gradle),
      # lo borra al salir y verifica lo firmado antes de que nada se publique (QA-14).
      - name: Firmar y verificar APK y AAB
        if: steps.ver.outputs.publicar == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # Opcional (variable de repo o del entorno): huella SHA-256 esperada del certificado, con o sin dos puntos.
          CERT_ESPERADO: ${{ vars.RELEASE_CERT_SHA256 }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          umask 077
          ks="$RUNNER_TEMP/rally-copilot-release.jks"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ks"

          bt="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$bt/apksigner" || { echo "::error::Sin apksigner en $bt"; exit 1; }
          apk_sin="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          aab_sin="$(find app/build/outputs/bundle/release -name '*.aab' | head -n1)"
          test -n "$apk_sin" || { echo "::error::No se genero el APK release"; exit 1; }
          test -n "$aab_sin" || { echo "::error::No se genero el AAB release"; exit 1; }
          mkdir -p dist
          apk="dist/rally-copilot-${VERSION}.apk"
          aab="dist/rally-copilot-${VERSION}.aab"

          # Las contrasenas viajan por variables de entorno (env:/:env), nunca en la linea de comandos.
          export KS_PASS KEY_PASS
          "$bt/zipalign" -c 4 "$apk_sin"
          "$bt/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --v4-signing-enabled false --out "$apk" "$apk_sin"
          jarsigner -keystore "$ks" -storepass:env KS_PASS -keypass:env KEY_PASS \
            -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "$aab" "$aab_sin" "$KEY_ALIAS"
          rm -f "$ks"

          # Verificacion del artefacto firmado.
          certs="$("$bt/apksigner" verify --verbose --print-certs "$apk")"
          # Lineas del certificado (publicas) en el log; el prefijo cambia segun la version de apksigner.
          printf '%s\n' "$certs" | grep -iE 'scheme|signer' || true
          digest="$(printf '%s\n' "$certs" | sed -n 's/^.*certificate SHA-256 digest: //p' | sed -n 1p)"
          test -n "$digest" || { echo "::error::apksigner no informa la huella del certificado"; exit 1; }
          if [ -n "$CERT_ESPERADO" ]; then
            esperado="$(printf '%s' "$CERT_ESPERADO" | tr -d ': ' | tr 'A-F' 'a-f')"
            [ "$digest" = "$esperado" ] || { echo "::error::El certificado de firma no es el esperado (RELEASE_CERT_SHA256)"; exit 1; }
          fi
          verificado="$(jarsigner -verify "$aab")"
          printf '%s\n' "$verificado" | grep -q 'jar verified' || { echo "::error::El AAB firmado no verifica"; exit 1; }

          insignia="$("$bt/aapt2" dump badging "$apk" | sed -n "s/^package: name='\([^']*\)' versionCode='\([^']*\)' versionName='\([^']*\)'.*/\1 \2 \3/p" | head -n1)"
          if [ "$insignia" != "app.trombito.rallycopilot $CODE $VERSION" ]; then
            echo "::error::El APK firmado no casa con :app:imprimirVersion (esperado app.trombito.rallycopilot $CODE $VERSION; obtenido '$insignia')"
            exit 1
          fi
          test "$(stat -c %s "$apk")" -ge 1048576 || { echo "::error::El APK firmado es sospechosamente pequeno"; exit 1; }
          test "$(stat -c %s "$aab")" -ge 1048576 || { echo "::error::El AAB firmado es sospechosamente pequeno"; exit 1; }
          {
            echo "## Release ${VERSION} (versionCode ${CODE})"
            echo
            echo "Huella SHA-256 del certificado de firma: \`${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar assets y checksums
        if: steps.ver.outputs.publicar == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          aab="dist/rally-copilot-${VERSION}.aab"
          test -f "dist/rally-copilot-${VERSION}.apk" || { echo "::error::Falta el APK firmado"; exit 1; }
          test -f "$aab" || { echo "::error::Falta el AAB firmado"; exit 1; }
          # Simbolos nativos para Play: carpetas de ABI en la raiz del zip (<abi>/<lib>.so), tal como salen de base/lib del AAB.
          symdir="$(mktemp -d)"
          if unzip -q "$aab" 'base/lib/*' -d "$symdir" 2>/dev/null && [ -d "$symdir/base/lib" ]; then
            (cd "$symdir/base/lib" && zip -qr "$GITHUB_WORKSPACE/dist/native-debug-symbols-${VERSION}.zip" .)
          else
            echo "::notice::El AAB no tiene base/lib (sin codigo nativo): no se genera native-debug-symbols."
          fi
          rm -rf "$symdir"
          (cd dist && files=("rally-copilot-${VERSION}.apk" "rally-copilot-${VERSION}.aab")             && { [ ! -f "native-debug-symbols-${VERSION}.zip" ] || files+=("native-debug-symbols-${VERSION}.zip"); }             && sha256sum "${files[@]}" > checksums.txt)

      # Lo que publica el job `github-release`: APK, AAB, symbols y checksums. Sin keystore ni codigo fuente.
      - name: Guardar assets para el job github-release
        if: steps.ver.outputs.publicar == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-${{ steps.ver.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Guardar AAB y notas para el job play
        if: steps.ver.outputs.publicar == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-${{ steps.ver.outputs.version }}
          path: |
            dist/rally-copilot-${{ steps.ver.outputs.version }}.aab
            dist/native-debug-symbols-*.zip
            distribution/whatsnew/
          if-no-files-found: error
          retention-days: 7

      - name: Borrar keystore y propiedades locales
        if: always()
        run: rm -f "$RUNNER_TEMP/rally-copilot-release.jks" local.properties

  # Release de GitHub (tag, assets y checksums). Unico job con `contents: write`: no hace checkout ni ve el keystore,
  # solo descarga los artifacts que dejo `release` y los publica. `gh` usa GH_REPO en vez de un repo clonado.
  github-release:
    name: Release de GitHub
    needs: release
    if: needs.release.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-${{ needs.release.outputs.version }}
          path: dist

      - name: Crear GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          assets=("dist/rally-copilot-${VERSION}.apk" "dist/rally-copilot-${VERSION}.aab" dist/checksums.txt)
          if [ -f "dist/native-debug-symbols-${VERSION}.zip" ]; then
            assets+=("dist/native-debug-symbols-${VERSION}.zip")
          fi
          gh release create "v${VERSION}" \
            "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "Rally Copilot ${VERSION}" \
            --generate-notes

  # Subida a Google Play (docs/play.md). POSPUESTA: hoy se distribuye solo por GitHub Release + Obtainium
  # (docs/obtainium.md); el job solo corre con la variable de repo PLAY_HABILITADO=true. Job aparte y sin permisos: la acción de terceros no ve el keystore
  # ni un GITHUB_TOKEN con escritura. Espera a `github-release` (ademas de `release`, de donde salen version y code):
  # asi, si la release de GitHub falla, nada llega a Play y se puede relanzar (el tag no existe y el mismo versionCode
  # no se sube dos veces). Si Play falla, la release de GitHub ya está hecha y el AAB va adjunto para subirlo a
  # mano. Sin el secreto PLAY_SERVICE_ACCOUNT_JSON se omite con un aviso. Tras subir a la interna, promociona esa misma
  # versión a la prueba cerrada (PLAY_PISTA_CERRADA, por defecto alpha; `ninguna` la desactiva). El script viaja en el
  # artifact `play-script` (subido antes de Gradle) para no necesitar checkout ni permisos en este job.
  play:
    name: Google Play (interna y prueba cerrada)
    needs: [release, github-release]
    if: needs.release.outputs.publicar == 'true' && vars.PLAY_HABILITADO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PLAY_SERVICE_ACCOUNT_JSON vive en el Environment `release` (restringido a main).
    environment: release
    permissions: {}
    steps:
      - name: Comprobar credenciales y estado
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_ESTADO: ${{ vars.PLAY_ESTADO || 'draft' }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::notice::Sin PLAY_SERVICE_ACCOUNT_JSON: no se sube a Google Play (ver docs/play.md)."
            echo "subir=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$PLAY_ESTADO" in
            draft|completed) ;;
            *) echo "::error::PLAY_ESTADO debe ser draft o completed, no '$PLAY_ESTADO'"; exit 1 ;;
          esac
          echo "estado=$PLAY_ESTADO" >> "$GITHUB_OUTPUT"
          echo "subir=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.play.outputs.subir == 'true'
        with:
          name: play-${{ needs.release.outputs.version }}
          path: play

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.play.outputs.subir == 'true' && vars.PLAY_PISTA_CERRADA != 'ninguna'
        with:
          name: play-script
          path: play-script

      - name: Localizar simbolos nativos
        id: sym
        if: steps.play.outputs.subir == 'true'
        env:
          ZIP: play/dist/native-debug-symbols-${{ needs.release.outputs.version }}.zip
        run: |
          if [ -f "$ZIP" ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Sin native-debug-symbols en el artifact: se sube solo el AAB."
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Subir el AAB
        if: steps.play.outputs.subir == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.trombito.rallycopilot
          releaseFiles: play/dist/rally-copilot-${{ needs.release.outputs.version }}.aab
          track: internal
          status: ${{ steps.play.outputs.estado }}
          # El mapping de R8 va dentro del AAB: https://developer.android.com/topic/performance/app-optimization/test-and-troubleshoot-the-optimization
          whatsNewDirectory: play/distribution/whatsnew
          # Los .so de AndroidX vienen stripped: se sube la tabla de simbolos exportados para que Play no avise.
          debugSymbols: ${{ steps.sym.outputs.existe == 'true' && format('play/dist/native-debug-symbols-{0}.zip', needs.release.outputs.version) || '' }}

      # El mismo AAB no se puede subir dos veces: se copia la release de la interna a la pista cerrada con la API de edits.
      # ubuntu-latest ya trae Node, no hace falta setup-node.
      - name: Promocionar a la prueba cerrada
        if: steps.play.outputs.subir == 'true' && vars.PLAY_PISTA_CERRADA != 'ninguna'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PISTA_CERRADA: ${{ vars.PLAY_PISTA_CERRADA || 'alpha' }}
          VERSION_CODE: ${{ needs.release.outputs.code }}
          ESTADO: ${{ steps.play.outputs.estado }}
        run: >-
          node play-script/play-promocionar.mjs
          --paquete app.trombito.rallycopilot
          --version-code "$VERSION_CODE"
          --de internal
          --a "$PISTA_CERRADA"
          --estado "$ESTADO"
