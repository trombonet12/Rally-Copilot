# Dependabot: Gradle (raiz) y GitHub Actions.
# Semanal; minor+patch agrupados por ecosistema, majors en PRs individuales.
# cooldown: no se propone una version hasta 7 dias despues de publicarse (14 las major); los paquetes
# envenenados suelen retirarse en esos dias (auditoria SEG-2).
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: 'chore(deps)'
    groups:
      gradle-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: 'chore(ci)'
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
